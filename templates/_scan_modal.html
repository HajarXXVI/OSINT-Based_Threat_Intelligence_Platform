<!-- Scan Progress Modal (shared partial: included by index.html and report pages) -->
<div id="scan-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <!-- Backdrop (click anywhere outside the panel to close) -->
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeScanModal()"></div>
    <!-- Modal Panel -->
    <div class="relative w-full max-w-2xl bg-slate-900 border border-cyan-800/70 rounded-lg shadow-2xl overflow-hidden">
        <!-- Modal Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800 bg-slate-950/80">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-radar text-fuchsia-500 animate-pulse"></i>
                <div>
                    <h3 class="font-cyber font-bold text-sm tracking-widest text-cyan-400 uppercase">Scan in Progress</h3>
                    <p class="text-[10px] font-mono text-slate-400">Target: <span id="modal-target" class="text-fuchsia-400 font-bold"></span></p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span id="modal-badge" class="flex items-center gap-2 text-[10px] font-mono font-bold uppercase tracking-widest text-amber-400 border border-amber-500/30 bg-amber-950/30 rounded px-2 py-1">
                    <i class="fa-solid fa-circle text-[8px] animate-pulse"></i> Analyzing
                </span>
                <button type="button" onclick="closeScanModal()" title="Close" class="text-slate-500 hover:text-cyan-400 transition text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
        <!-- Modal Body -->
        <div class="p-4 font-mono text-xs space-y-3">
            <!-- Live log (terminal style) -->
            <div id="scan-modal-log" class="bg-black/70 border border-slate-800 rounded p-3 h-40 overflow-y-auto text-emerald-400/90 text-[11px] leading-relaxed whitespace-pre-wrap break-words">
                <div class="text-slate-600"># Opening intelligence pipeline...</div>
            </div>
            <!-- Progress stage lines -->
            <div id="scan-modal-lines" class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                <div class="p-2 bg-slate-950/60 border border-slate-800/80 rounded flex items-center gap-2 text-slate-400">
                    <i class="fa-solid fa-rotate text-cyan-400 animate-spin"></i>
                    <span>Awaiting intelligence pipeline...</span>
                </div>
            </div>
        </div>
        <!-- Modal Footer -->
        <div class="flex justify-end px-4 py-3 border-t border-slate-800 bg-slate-950/80">
            <button type="button" onclick="closeScanModal()"
                    class="px-4 py-2 text-[11px] font-mono uppercase tracking-widest rounded border border-slate-700 text-slate-300 hover:border-cyan-500/50 hover:text-cyan-400 transition">
                Close
            </button>
        </div>
    </div>
</div>

<!-- Hidden SSE status holder (client-only) -->
<div id="scan-status" class="hidden"></div>
